<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подарок 🎁</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== СЛАЙД 1 ===== -->
  <div class="slide active" id="slide1">
    <div class="gif-place">
      <img src="minion.jpg" alt="Картинка">
    </div>
    <h1>Ты готова получить свой подарок?</h1>
    <div class="buttons">
      <button class="btn-yes" onclick="goToSlide(2)">Да 💛</button>
      <button class="btn-no" id="noBtn">Нет</button>
    </div>
  </div>

  <!-- ===== СЛАЙД 2: УГАДАЙКА ===== -->
  <div class="slide" id="slide2">
    <h1>Угадай, что за подарок? 🤔</h1>
    <p class="hint">Подсказка: связано с красотой 💅</p>

    <input
      type="text"
      id="guessInput"
      class="guess-input"
      placeholder="Напиши свой вариант..."
      autocomplete="off"
    >

    <button class="btn-check" id="checkBtn" onclick="checkGuess()">Проверить</button>

    <p class="attempts" id="attemptsText">Осталось попыток: 3</p>

    <!-- Всплывающая картинка -->
    <div class="popup" id="popup">
      <img id="popupImg" src="" alt="Картинка">
    </div>
  </div>

 <!-- ===== СЛАЙД 3: КАЛЕНДАРЬ ===== -->
<div class="slide" id="slide3">
  <h1>Выбери удобный день 📅</h1>
  <p class="hint">Жёлтые дни — свободны для записи</p>

  <div class="calendar">
    <div class="cal-header">
      <button class="cal-nav" id="prevMonth">‹</button>
      <span id="monthLabel">Октябрь 2026</span>
      <button class="cal-nav" id="nextMonth">›</button>
    </div>

    <div class="cal-weekdays">
      <span>Пн</span><span>Вт</span><span>Ср</span>
      <span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
    </div>

    <div class="cal-days" id="calDays"></div>

    <p class="cal-message" id="calMessage"></p>

    <button class="btn-yes cal-next-btn" id="calNextBtn" style="display:none;">
      Перейти к ближайшей дате
    </button>
  </div>

  <div class="selected-info" id="selectedInfo"></div>
</div>

<!-- ===== СЛАЙД 4: ФИНАЛ ===== -->
<div class="slide" id="slide4">
  <div class="big-emoji">🎉</div>
  <h1>Ура! Ты записана!</h1>
  <p class="slide2-text" id="finalText">Жду тебя 💛</p>
</div>

  <script src="script.js"></script>
</body>
</html>
